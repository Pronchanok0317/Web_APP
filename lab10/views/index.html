<!DOCTYPE html>
<html lang="th">

<body>

        <a class="button" href="/order">สั่งอาหาร</a>

    </section>

    <section class="container">
      <nav>
        <a href="/home">Home</a>

      <h2>เมนูแนะนำ</h2>

          <img src="/images/Somtam.jpg" alt="ส้มตำไทย">

          <p>รสเปรี้ยว หวาน เค็ม เผ็ด ครบรส</p>
