<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เมนูอาหาร</title>
  <link rel="icon" href="/images/lotus.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <h1>เมนูอาหาร</h1>
    <p class="muted">เลือกเมนูอาหารไทยจานโปรดจากร้านอาหารสัตตบุษย์</p>

    <nav>
      <a href="/home">Home</a>
      <a href="/menu">Menu</a>
      <a href="/order">Order</a>
    </nav>

    <label for="search">ค้นหาเมนู</label>
    <input id="search" type="search" placeholder="เช่น ส้มตำไทย">

    <section id="menuList" class="menu-grid"></section>
  </main>

  <script>
    const menuList = document.getElementById("menuList");
    const search = document.getElementById("search");

    async function loadMenus() {
      const params = search.value ? `?search=${encodeURIComponent(search.value)}` : "";
      const response = await fetch(`/api/menus${params}`);
      const menus = await response.json();

      menuList.innerHTML = menus.map((menu) => `
        <article class="card">
          <img src="${menu.image}" alt="${menu.name}">
          <h2>${menu.name}</h2>
          <p class="muted">${menu.type ? menu.type.name : "-"}</p>
          <p>${menu.description}</p>
          <p class="price">${menu.price} บาท</p>
        </article>
      `).join("");
    }

    search.addEventListener("input", loadMenus);
    loadMenus();
  </script>
</body>
</html>
