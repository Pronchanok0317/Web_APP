<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เมนูอาหาร</title>
  <link rel="icon" href="/images/lotus.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="container">
    <h1>เมนูอาหาร</h1>
    <p class="muted">เลือกเมนูอาหารไทยจานโปรดจากร้านอาหารสัตตบุษย์</p>

    <nav>
      <a href="/home">Home</a>
      <a href="/menu">Menu</a>
      <a href="/order">Order</a>
    </nav>

    <section class="toolbar">
      <div>
        <label for="search">ค้นหาเมนู</label>
        <input id="search" type="search" placeholder="เช่น ส้มตำไทย">
      </div>
      <button class="button secondary" type="button" id="toggleManager">จัดการเมนู</button>
    </section>

    <section id="menuList" class="menu-grid"></section>

    <section id="managerPanel" class="manager-panel">
      <h2>จัดการเมนู</h2>
      <p class="muted">เพิ่ม ลบ และแก้ไขข้อมูลเมนูผ่าน backend API ที่เชื่อมต่อฐานข้อมูล restaurant_db</p>
      <form id="menuForm" class="card menu-form">
        <h2 id="formTitle">New Food</h2>
        <input type="hidden" id="menuId">

        <label for="name">Name</label>
        <input id="name" name="name" required placeholder="เช่น ส้มตำไทย">

        <label for="price">Price</label>
        <input id="price" name="price" type="number" min="1" required placeholder="เช่น 60">

        <label for="typeId">Type</label>
        <select id="typeId" name="typeId" required></select>

        <label for="isBestSeller">Best Seller</label>
        <select id="isBestSeller" name="isBestSeller">
          <option value="true">BestSeller</option>
          <option value="false">Normal</option>
        </select>

        <div class="form-actions">
          <button class="button" type="submit">Save menu</button>
          <button class="button secondary" type="button" id="cancelEdit">Cancel</button>
        </div>
      </form>
    </section>

    <div id="message"></div>
  </main>

  <script>
    const menuList = document.getElementById("menuList");
    const search = document.getElementById("search");
    const menuForm = document.getElementById("menuForm");
    const formTitle = document.getElementById("formTitle");
    const menuId = document.getElementById("menuId");
    const nameInput = document.getElementById("name");
    const priceInput = document.getElementById("price");
    const typeSelect = document.getElementById("typeId");
    const bestSellerSelect = document.getElementById("isBestSeller");
    const cancelEdit = document.getElementById("cancelEdit");
    const message = document.getElementById("message");

    let types = [];

    async function loadMenus() {
      const params = search.value ? `?search=${encodeURIComponent(search.value)}` : "";
      const response = await fetch(`/api/menus${params}`);
      const menus = await response.json();

      menuList.innerHTML = menus.map((menu) => `
        <article class="card menu-card">
          <img src="${menu.image}" alt="${menu.name}">
          <h2>${menu.name}</h2>
          <p class="muted">${menu.type ? menu.type.name : "-"}</p>
          <p>${menu.description}</p>
          <p class="price">${menu.price} บาท</p>
          ${menu.isBestSeller ? '<span class="badge">Best Seller</span>' : ''}
          <div class="item-actions manager-only">
            <button type="button" class="button secondary" onclick='editMenu(${JSON.stringify(menu)})'>Edit</button>
            <button type="button" class="button danger" onclick="deleteMenu(${menu.menuId})">Del</button>
          </div>
        </article>
      `).join("");
    }

    async function loadTypes() {
      const response = await fetch("/api/types");
      types = await response.json();
      typeSelect.innerHTML = types.map((type) => (
        `<option value="${type.typeId}">${type.name}</option>`
      )).join("");
    }

    function resetForm() {
      menuId.value = "";
      formTitle.textContent = "New Food";
      menuForm.reset();
      if (types[0]) {
        typeSelect.value = types[0].typeId;
      }
      bestSellerSelect.value = "false";
    }

    function setManagerVisible(isVisible) {
      document.body.classList.toggle("manager-open", isVisible);
      document.getElementById("managerPanel").hidden = !isVisible;
      document.getElementById("toggleManager").textContent = isVisible
        ? "กลับสู่หน้าดูเมนู"
        : "จัดการเมนู";
      if (!isVisible) {
        resetForm();
      }
    }

    function editMenu(menu) {
      setManagerVisible(true);
      menuId.value = menu.menuId;
      formTitle.textContent = "Edit Food";
      nameInput.value = menu.name;
      priceInput.value = menu.price;
      typeSelect.value = menu.typeId;
      bestSellerSelect.value = String(menu.isBestSeller);
    }

    async function deleteMenu(id) {
      if (!confirm("ลบเมนูนี้ใช่ไหม?")) {
        return;
      }

      const response = await fetch(`/api/menus/${id}`, { method: "DELETE" });
      if (!response.ok) {
        const result = await response.json();
        message.innerHTML = `<div class="message error">ลบไม่สำเร็จ: ${result.error}</div>`;
        return;
      }

      message.innerHTML = '<div class="message">ลบเมนูสำเร็จ</div>';
      await loadMenus();
    }

    menuForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        name: nameInput.value,
        price: Number(priceInput.value),
        typeId: Number(typeSelect.value),
        isBestSeller: bestSellerSelect.value === "true",
      };
      const id = menuId.value;
      const response = await fetch(id ? `/api/menus/${id}` : "/api/menus", {
        method: id ? "PUT" : "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const result = await response.json();
        message.innerHTML = `<div class="message error">บันทึกไม่สำเร็จ: ${result.error}</div>`;
        return;
      }

      message.innerHTML = '<div class="message">บันทึกเมนูสำเร็จ</div>';
      resetForm();
      await loadMenus();
      setManagerVisible(false);
    });

    cancelEdit.addEventListener("click", () => {
      resetForm();
      setManagerVisible(false);
    });
    document.getElementById("toggleManager").addEventListener("click", () => {
      setManagerVisible(!document.body.classList.contains("manager-open"));
    });
    search.addEventListener("input", loadMenus);
    setManagerVisible(false);
    loadTypes().then(() => {
      resetForm();
      loadMenus();
    });
  </script>
</body>
</html>
